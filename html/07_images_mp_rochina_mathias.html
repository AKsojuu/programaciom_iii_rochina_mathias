<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
</head>
<body>
    <h1>Utilización de la etiqueta Img</h1>

    <img
        src="https://placehold.co/300x350?text=Aula+virtual"
        alt="Aula virtual"
        width="300"
        height="350"
        loading="eager"
    >

    <img
        src="https://placehold.co/300x350?text=Estudiante+en+linea"
        alt="Estudiante tomando clases en línea"
        width="300"
        height="350"
        loading="eager"
    >

    <img
        src="../images/elearning.jpg"
        alt="Computadora con curso en línea"
        width="300"
        height="350"
        loading="eager"
    >

    <figure>
        <img
            src="../images/plataforma.jpg"
            alt="Plataforma de aprendizaje"
            width="300"
            height="350"
            loading="eager"
        >
        <figcaption>
            Plataforma virtual donde los estudiantes revisan sus cursos
        </figcaption>
    </figure>

    <a href="https://es.wikipedia.org/wiki/Educaci%C3%B3n_virtual"
        target="_blank"
    >
        <img src="images/personajes/estudiante.jpg"
            alt="Más información sobre educación virtual"
            width="200"
        >
    </a>
</body>
</html>
