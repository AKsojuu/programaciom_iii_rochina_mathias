<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a JavaScript</title>
    <script>
        alert("¡Corre, Morty al inicio de la página!");
        console.log('saludo desde el inicio de la página');
    </script>
</head>
<body>
    <h1>Incluir JavaScript en documento HTML</h1>
    <h2>Modo Inline</h2>
    
    <button onclick="alert('¡Corre, Morty!')">
        Mostrar mensaje
    </button>

    <input type="text"
    oninput="console.log(this.value)"
    placeholder="Escribe algo...">

    <input type="text"
    onchange="console.log('Valor final guardado...', this.value)"
    placeholder="Escribe y haz click fuera...">

    <input type="text"
    onfocus="console.log('Valor final guardado...', this.value)"
    onblur="alert('¡Atención! Saliste del input')"
    placeholder="Haz click dentro y fuera...">

    <script src="01_incluir.js"></script>
</body>
</html>
