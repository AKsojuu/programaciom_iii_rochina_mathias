<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello CSS</title>
    <style>
        h1{
            color:blueviolet;
        }
        p {
            color: brown;
        }
    </style>
</head>
<body>
    <h1>Maneras de incluir estilos css en un archivo html</h1>
    <h1 style="color: gold;">Hello World con CSS-Tipo Inline</h1>
    <h2>Estilos CSS - Internos</h2>
    <p>Esta es la manera de incluir estilos tipo interno colocando los estilos en el head del HTML</p>
    <h3>Esrilos CSS - Externo</h3>
    <a>Se incluyò estilo a traves de un archivo externo</a>

</body>
</html>
