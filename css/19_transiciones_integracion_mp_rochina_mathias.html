<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Aula Virtual Animada</title>
    <link rel="stylesheet" href="19_transiciones_integracion_mp_rochina_mathias.css">
</head>
<body>
    <header>
        <h1>Aula Virtual</h1>
        <p>
            Simulación de una clase
            de E-learning.
        </p>
    </header>
    <main>
        <section class="escena"
                 aria-label="Escena animada del aula virtual">
            <div class="destello destello1"></div>
            <div class="destello destello2"></div>
            <div class="destello destello3"></div>
            <div class="destello destello4"></div>
            <div class="destello destello5"></div>
            <div class="computadora">
                <span aria-hidden="true">✈</span>
                <p>Clase en línea</p>
            </div>
            <div class="alerta">
                TAREA PENDIENTE
            </div>
        </section>
        <section class="controles">
            <h2>Panel de estudio</h2>
            <div class="panel">
                <article class="progreso-contenedor">
                    <h3>Progreso del curso</h3>
                    <div class="progreso"
                         aria-hidden="true">
                        <div class="pulso"></div>
                        <div class="centro"></div>
                    </div>
                </article>
                <article class="estado">
                    <h3>Estado del curso</h3>
                    <p>
                        Clases virtuales activas.
                    </p>
                    <p>
                        Curso: Programación Web
                    </p>
                    <p>
                        Plataforma: Moodle
                    </p>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <p>Aula Virtual - 2026</p>
    </footer>
</body>
</html>
